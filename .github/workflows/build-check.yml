name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # **生成物が Python のバージョンに依らないことを毎回確かめる。**
      # 以前は '3.x' 1本で回していて、CI だけ先に新しい系列へ上がった結果、
      # appdata がコミット済みのものと一致せずに落ちた（原因は 3.12 で sum() が
      # 誤差補償つきに変わったこと。build/generate.py の usage_tenths を参照）。
      # 下限と最新の2本で回せば、同じことが起きたその日に分かる。
      matrix:
        python-version: ['3.10', '3.x']
    name: verify (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: データの整合性を確認（party.txt・図鑑・技・特性）
        run: python build/generate.py

      - name: ブラウザ用データを書き出す
        run: python build/export_app_data.py

      # 落ちたときに「どのファイルのどこが違うか」がログに残るようにしておく。
      # --exit-code だけだと差分が出ないので、手元で再現できないと調べようがない。
      - name: appdata/ がコミット済みのものと一致するか確認
        run: |
          if ! git diff --quiet appdata/ data/code_dict.json; then
            echo '::error::生成物がコミット済みのものと一致しません'
            git diff --stat appdata/ data/code_dict.json
            git diff -U0 appdata/ data/code_dict.json | head -80
            exit 1
          fi

      - name: JS移植がPython版と同じ数値を出すか確認
        run: node build/verify_engine.js
