name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: データの整合性を確認（party.txt・図鑑・技・特性）
        run: python build/generate.py

      - name: ブラウザ用データを書き出す
        run: python build/export_app_data.py

      - name: appdata/ がコミット済みのものと一致するか確認
        run: git diff --exit-code appdata/

      - name: JS移植がPython版と同じ数値を出すか確認
        run: node build/verify_engine.js
