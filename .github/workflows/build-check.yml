name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 開発機と同じ系列に固定する。'3.x' だと CI だけ先に上がってしまい、
          # appdata の突き合わせが落ちたときに手元で再現できない。
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: データの整合性を確認（party.txt・図鑑・技・特性）
        run: python build/generate.py

      - name: ブラウザ用データを書き出す
        run: python build/export_app_data.py

      # 落ちたときに「どのファイルのどこが違うか」がログに残るようにしておく。
      # --exit-code だけだと差分が出ないので、手元で再現できないと調べようがない。
      - name: appdata/ がコミット済みのものと一致するか確認
        run: |
          if ! git diff --quiet appdata/ data/code_dict.json; then
            echo '::error::生成物がコミット済みのものと一致しません'
            git diff --stat appdata/ data/code_dict.json
            git diff -U0 appdata/ data/code_dict.json | head -80
            exit 1
          fi

      - name: JS移植がPython版と同じ数値を出すか確認
        run: node build/verify_engine.js
