name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install openpyxl

      - name: party.txt / データ整合性チェック込みでビルド
        run: python build/generate.py

      - name: index.html がコミット済みのものと一致するか確認
        run: git diff --exit-code index.html
